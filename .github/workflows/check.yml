name: check
on: [push, pull_request]
jobs:
  local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build -p rescrow-cli --locked
      - run: cargo tree --workspace --locked
      - name: Verify local dependency boundaries
        run: |
          python3 - <<'PYCODE'
          import subprocess
          def packages(package):
              output = subprocess.check_output(["cargo", "tree", "-p", package, "--edges", "normal", "--locked", "--prefix", "none", "--format", "{p}"], text=True)
              return {line.split()[0] for line in output.splitlines()}
          local = packages("rescrow-cli")
          assert not local & {"tokio", "axum", "proptest"}, local
          assert not any(name.startswith("aws-") for name in local), local
          assert packages("rescrow-domain") == {"rescrow-domain"}
          PYCODE
