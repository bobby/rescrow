[package]
name = "rescrow-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
rescrow-application.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
getrandom = "0.4"
tokio = { version = "1.54", features = ["rt", "time"] }

[dev-dependencies]
clap.workspace = true
hdrhistogram = { version = "7.5", default-features = false }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync"] }
