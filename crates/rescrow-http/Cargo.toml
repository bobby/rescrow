[package]
name = "rescrow-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
dsql = ["dep:rescrow-dsql"]

[dependencies]
rescrow-dsql = { path = "../rescrow-dsql", optional = true }
rescrow-application.workspace = true
rescrow-adapters.workspace = true
rescrow-server = { path = "../rescrow-server" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "matched-path", "query", "tokio"] }
axum-server = { version = "0.9.2", features = ["tls-rustls-ring"] }
tower-http = { version = "0.6", features = ["trace"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
jsonwebtoken = { version = "12.0.0", features = ["rust_crypto"] }
base64 = "0.22"
hmac = "0.13"
sha2 = "0.11"
percent-encoding = "2.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
rescrow-client = { path = "../rescrow-client" }
rescrow-test-support.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls-no-provider"] }
