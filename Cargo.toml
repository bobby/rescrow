[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[workspace.dependencies]
rescrow-domain = { path = "crates/rescrow-domain" }
rescrow-application = { path = "crates/rescrow-application" }
rescrow-adapters = { path = "crates/rescrow-adapters" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.6", features = ["derive"] }
